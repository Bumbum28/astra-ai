name: astra-ai

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment: &backend-environment
      APP_NAME: ${APP_NAME:-Astra AI Platform}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.6.0}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080","http://127.0.0.1:8080"]}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-https?://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?}
      CORS_ALLOW_PRIVATE_NETWORK: ${CORS_ALLOW_PRIVATE_NETWORK:-true}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astra_ai}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-3}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-this-secret-before-shared-use-123456789}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      PASSWORD_BCRYPT_ROUNDS: ${PASSWORD_BCRYPT_ROUNDS:-12}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}

      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gpt-5.6-terra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-180}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_STORE_RESPONSES: ${OPENAI_STORE_RESPONSES:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-roleplay-engine}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      CHAT_CONTEXT_TOKEN_BUDGET: ${CHAT_CONTEXT_TOKEN_BUDGET:-16384}
      CHAT_CONTEXT_MESSAGE_LIMIT: ${CHAT_CONTEXT_MESSAGE_LIMIT:-100}
      CHAT_MAX_MESSAGE_LENGTH: ${CHAT_MAX_MESSAGE_LENGTH:-12000}
      CHAT_DEFAULT_TEMPERATURE: ${CHAT_DEFAULT_TEMPERATURE:-0.8}
      CHAT_DEFAULT_MAX_TOKENS: ${CHAT_DEFAULT_MAX_TOKENS:-2048}
      CHAT_STREAM_HEARTBEAT_SECONDS: ${CHAT_STREAM_HEARTBEAT_SECONDS:-15}
      CONVERSATION_PAGE_SIZE_MAX: ${CONVERSATION_PAGE_SIZE_MAX:-100}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-true}
      INTELLIGENCE_PROVIDER: ${INTELLIGENCE_PROVIDER:-openai}
      INTELLIGENCE_PLANNER_MODEL: ${INTELLIGENCE_PLANNER_MODEL:-gpt-5.6-luna}
      INTELLIGENCE_CRITIC_MODEL: ${INTELLIGENCE_CRITIC_MODEL:-gpt-5.6-luna}
      INTELLIGENCE_PLANNER_REASONING_EFFORT: ${INTELLIGENCE_PLANNER_REASONING_EFFORT:-low}
      INTELLIGENCE_GENERATION_REASONING_EFFORT: ${INTELLIGENCE_GENERATION_REASONING_EFFORT:-medium}
      INTELLIGENCE_CRITIC_REASONING_EFFORT: ${INTELLIGENCE_CRITIC_REASONING_EFFORT:-low}
      INTELLIGENCE_PLANNER_MAX_TOKENS: ${INTELLIGENCE_PLANNER_MAX_TOKENS:-900}
      INTELLIGENCE_CRITIC_MAX_TOKENS: ${INTELLIGENCE_CRITIC_MAX_TOKENS:-700}
      INTELLIGENCE_CRITIC_SCORE_THRESHOLD: ${INTELLIGENCE_CRITIC_SCORE_THRESHOLD:-0.82}
      INTELLIGENCE_MAX_REWRITE_ATTEMPTS: ${INTELLIGENCE_MAX_REWRITE_ATTEMPTS:-1}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_EMBEDDINGS_ENABLED: ${MEMORY_EMBEDDINGS_ENABLED:-true}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-1536}
      MEMORY_EXTRACTION_PROVIDER: ${MEMORY_EXTRACTION_PROVIDER:-openai}
      MEMORY_EXTRACTION_MODEL: ${MEMORY_EXTRACTION_MODEL:-gpt-5.6-luna}
      MEMORY_EXTRACTION_REASONING_EFFORT: ${MEMORY_EXTRACTION_REASONING_EFFORT:-low}
      MEMORY_EXTRACTION_MAX_TOKENS: ${MEMORY_EXTRACTION_MAX_TOKENS:-1800}
      MEMORY_COMPACTION_MESSAGE_THRESHOLD: ${MEMORY_COMPACTION_MESSAGE_THRESHOLD:-12}
      MEMORY_COMPACTION_BATCH_SIZE: ${MEMORY_COMPACTION_BATCH_SIZE:-40}
      MEMORY_RETRIEVAL_LIMIT: ${MEMORY_RETRIEVAL_LIMIT:-8}
      MEMORY_RETRIEVAL_CANDIDATE_LIMIT: ${MEMORY_RETRIEVAL_CANDIDATE_LIMIT:-200}
      MEMORY_WORKER_POLL_SECONDS: ${MEMORY_WORKER_POLL_SECONDS:-2}
      MEMORY_WORKER_MAX_ATTEMPTS: ${MEMORY_WORKER_MAX_ATTEMPTS:-5}
      MEMORY_WORKER_RETRY_BASE_SECONDS: ${MEMORY_WORKER_RETRY_BASE_SECONDS:-15}
      MEMORY_WORKER_LOCK_TIMEOUT_SECONDS: ${MEMORY_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; prefix=os.getenv('API_V1_PREFIX', '/api/v1').rstrip('/'); urllib.request.urlopen(f'http://127.0.0.1:8000{prefix}/health/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - astra_network

  memory-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.workers.memory_worker"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - astra_network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astra_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra_ai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - astra_network

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >-
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes --save 60 1000;
        fi
      '
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - astra_network

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: astra_test
      POSTGRES_PASSWORD: astra_test_password
      POSTGRES_DB: astra_ai_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra_test -d astra_ai_test"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - astra_network

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      <<: *backend-environment
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://astra_test:astra_test_password@postgres-test:5432/astra_ai_test
      REDIS_HOST: redis
      INTELLIGENCE_ENABLED: "false"
      MEMORY_EMBEDDINGS_ENABLED: "false"
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pytest", "-q"]
    networks:
      - astra_network

volumes:
  postgres_data:
  redis_data:

networks:
  astra_network:
    driver: bridge
