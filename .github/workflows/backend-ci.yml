name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_ci_password
          POSTGRES_DB: astra_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astra -d astra_ai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://astra:astra_ci_password@localhost:5432/astra_ai
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests-123456789
      DEFAULT_LLM_PROVIDER: ollama
      DEFAULT_LLM_MODEL: roleplay-engine
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q app alembic

      - name: Verify single Alembic head
        shell: bash
        run: |
          heads="$(alembic heads | grep -c '(head)')"
          test "$heads" -eq 1
          alembic heads

      - name: Run tests
        run: pytest -q app/tests
